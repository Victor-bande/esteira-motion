<!doctype html>
<!-- STICKMAN · template v1 · 27/11/2026 · fixo. Cada vídeo traz só cenas.js (CENAS + ROTEIRO [+ FOTOS]) em ?c=caminho. ?grade=1 = folha de checagem. -->
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Baloo+2:wght@700;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #FBF6EE; }
  #palco { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Baloo 2', sans-serif; }
  #cena { position: absolute; inset: 0; transform-origin: 470px 820px; }
  .fundo { position: absolute; inset: -60px; }
  .peca { position: absolute; will-change: transform, opacity; }
  .ilu { filter: drop-shadow(0 16px 14px rgba(0,0,0,.25)); z-index: 8; }
  .foto { border-radius: 34px; border: 12px solid #fff; background: #fff; box-shadow: 0 26px 50px rgba(0,0,0,.3); }
  .brilho { position: absolute; font-size: 64px; color: #FFD43B; text-shadow: 0 0 10px #fff; }
  .titulo { top: 400px; left: 130px; width: 820px; text-align: center; font-family: 'Anton'; font-size: 118px; line-height: 1.02; color: #fff; letter-spacing: 1px; -webkit-text-stroke: 12px #111; paint-order: stroke fill; text-shadow: 0 9px 0 rgba(0,0,0,.25); z-index: 12; }
  .grande { font-family: 'Anton'; line-height: .95; color: #fff; -webkit-text-stroke: 10px #111; paint-order: stroke fill; text-shadow: 0 10px 0 rgba(0,0,0,.25); z-index: 15; white-space: nowrap; }
  .etq { padding: 10px 26px 6px; border-radius: 18px; background: #fff; color: #111; font-family: 'Lilita One'; font-size: 50px; line-height: 1.1; white-space: nowrap; border: 5px solid #111; box-shadow: 0 8px 0 #111; z-index: 14; }
  .etq i { font-style: normal; display: inline-block; width: 46px; height: 46px; line-height: 50px; text-align: center; border-radius: 50%; margin-right: 12px; color: #fff; font-size: 34px; vertical-align: 4px; }
  .etq.nao i { background: #E8384F; } .etq.sim i { background: #25C26E; }
  .etq.nao { color: #E8384F; } .etq.sim { color: #128A4A; }
  .preco { padding: 12px 26px 8px 54px; background: #FFD43B; border: 6px solid #111; border-radius: 16px 40px 40px 16px; font-family: 'Lilita One'; font-size: 58px; color: #111; transform-origin: left center; z-index: 15; }
  .preco::before { content: ''; position: absolute; left: 16px; top: 50%; width: 18px; height: 18px; margin-top: -9px; border-radius: 50%; border: 5px solid #111; background: #fff; }
  .balao { z-index: 13; } .balao .dentro { position: absolute; inset: 14% 16% 26%; display: flex; align-items: center; justify-content: center; font-family: 'Lilita One'; font-size: 54px; color: #111; }
  .balao .dentro img { max-width: 100%; max-height: 100%; }
  .item { display: flex; align-items: center; gap: 22px; z-index: 14; }
  .item b { width: 86px; height: 86px; border-radius: 50%; background: #FFD43B; border: 6px solid #111; display: flex; align-items: center; justify-content: center; font-family: 'Lilita One'; font-size: 52px; font-weight: 400; }
  .item span { padding: 10px 26px 6px; border-radius: 40px; background: #fff; border: 5px solid #111; font-family: 'Lilita One'; font-size: 48px; white-space: nowrap; }
  .carrinho { padding: 18px 40px 12px; border-radius: 60px; background: #FF6A2B; border: 6px solid #111; box-shadow: 0 10px 0 #111; font-family: 'Lilita One'; font-size: 54px; color: #fff; white-space: nowrap; z-index: 16; }
  .carrinho span { margin-right: 14px; }
  .card { padding: 26px 30px; border-radius: 34px; background: #fff; border: 6px solid #111; box-shadow: 0 12px 0 #111; font-family: 'Lilita One'; font-size: 52px; line-height: 1.1; color: #111; text-align: center; z-index: 14; }
  .card em { font-style: normal; color: #E8384F; }
  .boneco { z-index: 10; }
  #leg { position: absolute; top: 262px; left: 120px; width: 840px; text-align: center; z-index: 30; }
  #leg span { display: inline-block; padding: 10px 30px 4px; background: #fff; border: 6px solid #111; border-radius: 22px; box-shadow: 0 8px 0 #111; font-family: 'Lilita One'; font-size: 66px; line-height: 1.12; color: #111; text-transform: uppercase; }
  #leg em { font-style: normal; color: #E8384F; }
  .grade { position: absolute; inset: 0; z-index: 99; pointer-events: none; }
</style></head>
<body><div id="palco"><div id="cena"></div><div id="leg"></div></div>
<script src="stickman/boneco.js"></script>
<script src="stickman/cena.js"></script>
<script src="stickman/three.min.js"></script>
<script src="stickman/tres.js"></script>
<script>document.write(`<script src="${new URLSearchParams(location.search).get('c')}"><\/script>`);</script>
<script>
if (new URLSearchParams(location.search).get('grade')) document.getElementById('palco').insertAdjacentHTML('beforeend', `<svg class="grade" width="1080" height="1920">
  <rect x="120" y="240" width="840" height="600" fill="none" stroke="#0c0" stroke-width="4"/><rect x="120" y="840" width="660" height="400" fill="none" stroke="#0c0" stroke-width="4"/>
  <rect x="0" y="0" width="1080" height="240" fill="rgba(255,0,0,.2)"/><rect x="0" y="1240" width="1080" height="680" fill="rgba(255,0,0,.2)"/><rect x="780" y="840" width="300" height="400" fill="rgba(255,0,0,.2)"/></svg>`);
</script></body></html>
