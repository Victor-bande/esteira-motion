<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #1a1240; }
  #palco { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Baloo 2', sans-serif; }
  .fundo { position: absolute; inset: 0; }
  .chao { position: absolute; left: 0; right: 0; bottom: 0; height: 560px; }
  .balcao { position: absolute; left: -40px; right: -40px; bottom: 470px; height: 60px; border-radius: 18px; }
  .titulo { position: absolute; top: 150px; left: 60px; right: 60px; text-align: center; font-family: 'Lilita One'; font-size: 96px; line-height: 1.02; color: #fff; -webkit-text-stroke: 10px #111; paint-order: stroke fill; }
  .legenda { position: absolute; top: 1240px; left: 0; right: 0; text-align: center; font-family: 'Lilita One'; font-size: 120px; color: #fff; -webkit-text-stroke: 14px #111; paint-order: stroke fill; z-index: 20; }
  .pop { position: absolute; font-family: 'Lilita One'; font-size: 110px; color: #FF2E2E; -webkit-text-stroke: 12px #fff; paint-order: stroke fill; transform: rotate(-6deg); z-index: 15; text-shadow: 0 8px 0 rgba(0,0,0,.25); }
  .rotulo { position: absolute; font-family: 'Lilita One'; font-size: 54px; color: #fff; -webkit-text-stroke: 8px #111; paint-order: stroke fill; text-align: center; width: 340px; }
  .masc { position: absolute; }
  .foto { position: absolute; border-radius: 36px; box-shadow: 0 30px 60px rgba(0,0,0,.35); border: 10px solid #fff; object-fit: cover; }
  .pote { position: absolute; width: 150px; height: 200px; border-radius: 26px 26px 34px 34px; border: 6px solid #222; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 800; font-size: 30px; line-height: 1; color: #fff; }
  .pote::before { content: ''; position: absolute; top: -34px; left: 8px; right: 8px; height: 38px; border-radius: 12px; background: #333; border: 6px solid #222; }
  .check { position: absolute; left: 80px; font-family: 'Lilita One'; font-size: 74px; color: #fff; -webkit-text-stroke: 9px #111; paint-order: stroke fill; }
  .check b { color: #3BE07A; -webkit-text-stroke: 9px #111; }
  .cel { position: absolute; left: 290px; top: 200px; width: 600px; height: 1000px; background: #111; border-radius: 70px; padding: 26px; box-shadow: 0 40px 80px rgba(0,0,0,.4); }
  .tela { width: 100%; height: 100%; background: #fff; border-radius: 50px; overflow: hidden; padding: 40px 34px; }
  .estrelas { color: #FFB400; font-size: 64px; letter-spacing: 4px; }
  .seta { position: absolute; font-size: 170px; z-index: 16; }
  .copo { position: absolute; }
</style></head>
<body><div id="palco"></div>
<script src="mascote.js"></script>
<script>
// cenas do V-C01-CR-E04-A1-G1 · data-w = palavra que faz o elemento entrar
const W = (w, html) => html.replace(/^<(\w+) /, `<$1 data-w="${w}" `);
const cenas = {
  1: () => fundo('#2B1C6B', '#F4D06F', '#C98B4B') +
     W('rica', masc('rica','esperta',340,10,560)) + W('média', masc('media','duvida',340,370,560)) + W('pobre', masc('pobre','feliz',340,730,560)) +
     W('rica', rot('RICA 💰',10,470)) + W('média', rot('CLASSE<br>MÉDIA 😐',370,420)) + W('pobre', rot('POBRE ❌💰',730,470)) + W('qual', tit('QUAL TOMA A MELHOR CREATINA?')),
  2: () => fundo('#4A1E8C','#E9C46A','#B07C3A') + rot('RICA 💰',40,300) + masc('rica','esperta',420,40,380) +
     W('creatina', pote('CREA<br>TINA','#555',520,760)) + W('gaba', pote('GABA','#6B5B95',700,760)) + W('l-teanina', pote('L-TEA<br>NINA','#3D6D8C',880,760)) +
     W('mas', pop('❌ 3 POTES',470,520)),
  3: () => fundo('#37476B','#D9D2C3','#9C8F7B') + rot('CLASSE<br>MÉDIA 😐',40,220) + masc('media','nojo',420,40,380) + W('copo', copo(560,640)) + W('empelota', pop('❌ EMPELOTA',440,470)),
  4: () => fundo('#FF8FB5','#FFE3EC','#F7B7CB') + rot('POBRE ❌💰',20,300) + masc('pobre','esperta',400,20,380) + W('essa', foto('FRASCO-CR.png',470,420,560,860)),
  5: () => fundo('#FF8FB5','#FFE3EC','#F7B7CB') + foto('FRASCO-CR.png',300,640,480,560) +
     W('três', chk('3 EM 1',160)) + W('suco', chk('GOSTO DE SUCO',270)) + W('zero', chk('ZERO CALORIA',380)) + W('trinta', chk('30 DOSES',490)),
  6: () => fundo('#FF8FB5','#FFE3EC','#F7B7CB') + foto('FOTO-CR-03-copo-rosa.jpg',150,260,780,1180) + W('dosadores', pop('2 DOSADORES + ÁGUA',70,1480)),
  8: () => fundo('#37476B','#D9D2C3','#9C8F7B') + masc('media','duvida',420,40,380) + pote('CREA<br>TINA<br>PURA','#777',620,760) + W('encostada', pop('ENCOSTADA 🕸️',380,520)),
  7: () => fundo('#2B1C6B','#F4D06F','#C98B4B') + masc('pobre','esperta',300,-20,1000) +
     `<div class="cel"><div class="tela"><img src="fotos/FRASCO-CR.png" style="width:100%;height:440px;object-fit:cover;border-radius:28px">
      <div style="font-size:52px;font-weight:800;line-height:1.1;margin-top:24px;color:#111">Creatina 3 em 1 · Soufit · Pink Lemonade</div>
      <div class="estrelas">★★★★★</div><div style="font-size:58px;font-weight:800;color:#111">4,8 · 10 mil avaliações</div></div></div>` +
     W('carrinho', `<div class="seta" style="left:820px;top:1560px">👇</div>`),
};
function fundo(ceu, chao, balcao) { return `<div class="fundo" style="background:linear-gradient(${ceu},${ceu} 55%,#000 160%)"></div><div class="chao" style="background:${chao}"></div><div class="balcao" style="background:${balcao}"></div>`; }
function masc(t, e, w, x, y) { return `<div class="masc" style="left:${x}px;top:${y}px">${mascote(t, e, w)}</div>`; }
function rot(t, x, y) { return `<div class="rotulo" style="left:${x}px;top:${y}px">${t}</div>`; }
function tit(t) { return `<div class="titulo">${t}</div>`; }
function leg(t) { return `<div class="legenda">${t}</div>`; }
function pop(t, x, y) { return `<div class="pop" style="left:${x}px;top:${y}px">${t}</div>`; }
function pote(t, c, x, y) { return `<div class="pote" style="left:${x}px;top:${y}px;background:${c}">${t}</div>`; }
function foto(f, x, y, w, h) { return `<img class="foto" src="fotos/${f}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">`; }
function chk(t, y) { return `<div class="check" style="top:${y}px"><b>✓</b> ${t}</div>`; }
function copo(x, y) { return `<svg class="copo" style="left:${x}px;top:${y}px" width="360" height="460" viewBox="0 0 360 460">
  <path d="M40 20 L320 20 L285 440 L75 440 Z" fill="rgba(220,235,255,.55)" stroke="#222" stroke-width="8"/>
  <path d="M60 140 L300 140 L285 430 L75 430 Z" fill="#E8E1D0"/>
  ${[[120,380],[200,400],[160,330],[240,350],[110,300],[220,280]].map(([a,b])=>`<circle cx="${a}" cy="${b}" r="${18+((a+b)%14)}" fill="#C9BFA8" stroke="#222" stroke-width="4"/>`).join('')}
  <rect x="230" y="-60" width="22" height="300" rx="10" fill="#9aa3ad" stroke="#222" stroke-width="5" transform="rotate(18 240 100)"/></svg>`; }

// roteiro: cena → falas (índices do tempos.json)
const ROTEIRO = [[1,[0,1,2]],[2,[3,4]],[3,[5,6]],[4,[7]],[5,[8,9,10]],[6,[11]],[8,[12]],[7,[13,14]]];
const palco = document.getElementById('palco'); let atual = -1, plano = [], palavras = [];
const limpa = w => w.toLowerCase().replace(/[.,:;!?…]/g, '');
window.setup = (tempos) => {
  palavras = tempos.flatMap(f => f.palavras.map(p => ({ ...p, w: p.p.replace(/[.,:;!?]/g,'') })));
  plano = ROTEIRO.map(([c, idx]) => ({ c, ini: tempos[idx[0]].inicio, fim: tempos[idx[idx.length-1]].fim,
                                       ws: idx.flatMap(i => tempos[i].palavras) }));
  plano[0].ini = 0; for (let i = 0; i < plano.length - 1; i++) plano[i].fim = plano[i+1].ini;
  plano[plano.length-1].fim += 0.8; return plano[plano.length-1].fim;
};
const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x,0),1), 3);
const bounce = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 + 0.25 * Math.sin(x * Math.PI) * (1 - x) + (ease(x) - 1);
window.render = (t) => {
  const k = plano.findIndex(p => t >= p.ini && t < p.fim); const i = k < 0 ? plano.length - 1 : k; const p = plano[i];
  if (i !== atual) {
    atual = i; palco.innerHTML = cenas[p.c]() + '<div class="legenda" id="leg"></div>';
    palco.querySelectorAll('[data-w]').forEach(el => {
      const alvo = limpa(el.dataset.w); const hit = p.ws.find(w => limpa(w.p).startsWith(alvo));
      el.dataset.t = hit ? hit.inicio : p.ini; el.style.transformOrigin = 'center';
    });
  }
  const loc = t - p.ini, dur = p.fim - p.ini;
  const punch = (Math.floor(loc / 1.4) % 2) ? 0.08 * ease((loc % 1.4) / 0.15) : 0.08 * (1 - ease((loc % 1.4) / 0.15));
  const zoom = 1 + 0.05 * (loc / dur) + (i === 0 ? 0 : punch) + 0.06 * (1 - ease(loc / 0.25));
  palco.style.transform = `scale(${zoom})`; palco.style.transformOrigin = '50% 45%';
  palco.querySelectorAll('[data-t]').forEach(el => {
    const x = (t - +el.dataset.t) / 0.22; const base = el.classList.contains('pop') ? ' rotate(-6deg)' : '';
    el.style.opacity = x <= 0 ? 0 : 1; el.style.transform = `scale(${Math.max(bounce(x), 0.001)})` + base;
  });
  let w = null; for (const q of palavras) { if (q.inicio <= t) w = q; else break; }
  const leg = document.getElementById('leg'); leg.textContent = w ? w.w : '';
  const lx = w ? (t - w.inicio) / 0.12 : 1; leg.style.transform = `scale(${0.85 + 0.15 * ease(lx)})`;
};
</script></body></html>
